# Weekly checks for package updates and security fixes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Big version jumps can break the build. Skip them; test and apply
    # them by hand. Security alerts still show in the Security tab.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
